<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  :root{
    --sky1:#bfe6f5; --sky2:#e9f6fb; --ground:#cfe3d2; --road:#5f6b72;
    --ink:#1f2a33; --frame:#e0533d; --tire:#22282e; --spoke:#8e979d;
    --feather:#f4f7f9; --feather2:#d9e4ea; --beak:#f2a03d; --pouch:#f6c67a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, #f7fbfd 0%, #e7eef2 60%, #d8e2e8 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); padding:24px;
  }
  .card{
    width:min(920px,100%); background:#fff; border-radius:18px;
    box-shadow:0 18px 45px rgba(31,42,51,.16), 0 2px 6px rgba(31,42,51,.08);
    padding:18px 18px 12px;
  }
  h1{margin:0 0 10px; font-size:18px; letter-spacing:.02em}
  .stage{border-radius:14px; overflow:hidden; background:linear-gradient(180deg,var(--sky1),var(--sky2) 76%,var(--ground) 76%)}
  svg{display:block; width:100%; height:auto}
  .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 2px 4px; font-size:13px}
  .bar button{
    border:1px solid #c9d4db; background:#f3f7f9; border-radius:9px; padding:7px 12px;
    font:inherit; cursor:pointer; color:var(--ink)
  }
  .bar button:hover{background:#e8f0f4}
  .bar span{color:#5b6871}
  .note{margin:6px 2px 0; font-size:12px; color:#6b7882}

  /* ---- animation ---- */
  .wheel{transform-box:view-box; animation:spin var(--spin,1.1s) linear infinite}
  .crank{transform-box:view-box; transform-origin:430px 292px; animation:spin var(--cycle,1.6s) linear infinite}
  .pelican{transform-box:view-box; transform-origin:360px 205px; animation:bob var(--cycle,1.6s) ease-in-out infinite}
  .head{transform-box:view-box; transform-origin:452px 132px; animation:nod var(--cycle,1.6s) ease-in-out infinite}
  .pouch{transform-box:view-box; transform-origin:510px 134px; animation:pouch var(--cycle,1.6s) ease-in-out infinite}
  .wing{transform-box:view-box; transform-origin:340px 190px; animation:flap var(--cycle,1.6s) ease-in-out infinite}
  .dash{animation:dash var(--spin,1.1s) linear infinite}
  .cloud{animation:drift 14s linear infinite}
  .cloud.b{animation-duration:19s; animation-delay:-6s}
  .cloud.c{animation-duration:24s; animation-delay:-12s}
  .sun{transform-box:fill-box; transform-origin:center; animation:pulse 6s ease-in-out infinite}
  .speed{animation:speed var(--spin,1.1s) linear infinite}
  .speed.b{animation-delay:.35s}
  .speed.c{animation-delay:.7s}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-1.2deg)}}
  @keyframes nod{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(1px,-2px) rotate(2deg)}}
  @keyframes pouch{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.12) translateY(1px)}}
  @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
  @keyframes dash{to{transform:translateX(-160px)}}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes speed{0%{opacity:0; transform:translateX(20px)}20%{opacity:.75}100%{opacity:0; transform:translateX(-70px)}}

  .paused *{animation-play-state:paused !important}
  @media (prefers-reduced-motion:reduce){
    .wheel,.crank,.pelican,.head,.pouch,.wing,.thigh,.shank,.dash,.cloud,.sun,.speed{animation:none}
  }

  /* ---- pedalling linkage (solved IK, phase-offset legs) ---- */
@keyframes legT_near{
0.0%{transform:rotate(0.0deg)}
12.5%{transform:rotate(34.5deg)}
25.0%{transform:rotate(56.4deg)}
37.5%{transform:rotate(53.9deg)}
50.0%{transform:rotate(46.3deg)}
62.5%{transform:rotate(26.4deg)}
75.0%{transform:rotate(-25.5deg)}
87.5%{transform:rotate(-28.4deg)}
100%{transform:rotate(0.0deg)}
}
@keyframes legS_near{
0.0%{transform:rotate(0.0deg)}
12.5%{transform:rotate(-5.6deg)}
25.0%{transform:rotate(4.9deg)}
37.5%{transform:rotate(39.8deg)}
50.0%{transform:rotate(73.0deg)}
62.5%{transform:rotate(90.0deg)}
75.0%{transform:rotate(46.8deg)}
87.5%{transform:rotate(12.0deg)}
100%{transform:rotate(0.0deg)}
}
@keyframes legT_far{
0.0%{transform:rotate(46.3deg)}
12.5%{transform:rotate(26.4deg)}
25.0%{transform:rotate(-25.5deg)}
37.5%{transform:rotate(-28.4deg)}
50.0%{transform:rotate(0.0deg)}
62.5%{transform:rotate(34.5deg)}
75.0%{transform:rotate(56.4deg)}
87.5%{transform:rotate(53.9deg)}
100%{transform:rotate(46.3deg)}
}
@keyframes legS_far{
0.0%{transform:rotate(73.0deg)}
12.5%{transform:rotate(90.0deg)}
25.0%{transform:rotate(46.8deg)}
37.5%{transform:rotate(12.0deg)}
50.0%{transform:rotate(0.0deg)}
62.5%{transform:rotate(-5.6deg)}
75.0%{transform:rotate(4.9deg)}
87.5%{transform:rotate(39.8deg)}
100%{transform:rotate(73.0deg)}
}
.thigh{transform-box:view-box; transform-origin:415px 235px; animation:legT_near var(--cycle,1.6s) linear infinite}
.shank{transform-box:view-box; transform-origin:461.7px 246.1px; animation:legS_near var(--cycle,1.6s) linear infinite}
.far .thigh{animation-name:legT_far} .far .shank{animation-name:legS_far}
</style>
</head>
<body>
<main class="card">
  <h1>Pelican riding a bicycle</h1>
  <div class="stage">
    <svg viewBox="0 0 900 460" role="img" aria-label="Animated pelican riding a bicycle" xmlns="http://www.w3.org/2000/svg">
      <title>Pelican riding a bicycle</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c3e8f6"/>
          <stop offset="1" stop-color="#ecf6fa"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6b777e"/>
          <stop offset="1" stop-color="#525c63"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbfdfe"/>
          <stop offset="1" stop-color="#d5e1e8"/>
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8cf8b"/>
          <stop offset="1" stop-color="#eda44f"/>
        </linearGradient>
        <g id="spokes">
          <g stroke="var(--spoke)" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-46" x2="0" y2="46"/>
            <line x1="-46" y1="0" x2="46" y2="0"/>
            <line x1="-33" y1="-33" x2="33" y2="33"/>
            <line x1="-33" y1="33" x2="33" y2="-33"/>
            <line x1="-18" y1="-42" x2="18" y2="42"/>
            <line x1="-42" y1="-18" x2="42" y2="18"/>
          </g>
        </g>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="900" height="350" fill="url(#sky)"/>

      <!-- sun -->
      <g class="sun">
        <circle cx="742" cy="86" r="34" fill="#ffd27a"/>
        <circle cx="742" cy="86" r="26" fill="#ffe4a8"/>
      </g>

      <!-- clouds -->
      <g fill="#ffffff" opacity=".85">
        <g class="cloud">
          <ellipse cx="150" cy="90" rx="46" ry="20"/>
          <ellipse cx="182" cy="78" rx="30" ry="18"/>
          <ellipse cx="118" cy="82" rx="24" ry="15"/>
        </g>
        <g class="cloud b">
          <ellipse cx="430" cy="60" rx="40" ry="17"/>
          <ellipse cx="458" cy="50" rx="26" ry="14"/>
        </g>
        <g class="cloud c">
          <ellipse cx="640" cy="130" rx="34" ry="14"/>
          <ellipse cx="662" cy="122" rx="22" ry="11"/>
        </g>
      </g>

      <!-- ground + road -->
      <rect x="0" y="350" width="900" height="110" fill="var(--ground)"/>
      <rect x="0" y="350" width="900" height="60" fill="url(#road)"/>
      <g>
        <g class="dash" fill="#f2f5f7">
          <rect x="0" y="378" width="60" height="6" rx="3"/>
          <rect x="160" y="378" width="60" height="6" rx="3"/>
          <rect x="320" y="378" width="60" height="6" rx="3"/>
          <rect x="480" y="378" width="60" height="6" rx="3"/>
          <rect x="640" y="378" width="60" height="6" rx="3"/>
          <rect x="800" y="378" width="60" height="6" rx="3"/>
          <rect x="960" y="378" width="60" height="6" rx="3"/>
          <rect x="1120" y="378" width="60" height="6" rx="3"/>
          <rect x="1280" y="378" width="60" height="6" rx="3"/>
        </g>
      </g>

      <!-- shadow -->
      <ellipse cx="430" cy="356" rx="190" ry="12" fill="#000" opacity=".14"/>

      <!-- speed lines -->
      <g stroke="#9db4c2" stroke-width="4" stroke-linecap="round">
        <line class="speed" x1="120" y1="150" x2="180" y2="150"/>
        <line class="speed b" x1="90" y1="200" x2="150" y2="200"/>
        <line class="speed c" x1="140" y1="250" x2="196" y2="250"/>
      </g>


      <!-- far leg (behind the bike) -->
      <g class="far" stroke="#c8d3da" stroke-width="11" stroke-linecap="round" fill="none">
        <g class="thigh"><line x1="415" y1="235" x2="461.7" y2="246.1"/>
          <g class="shank"><line x1="461.7" y1="246.1" x2="464" y2="292"/>
            <path d="M456 292 h22 l-4 10 h-18 z" fill="#c8d3da" stroke="none"/>
          </g>
        </g>
      </g>

      <!-- wheels -->
      <g class="wheel" style="transform-origin:250px 292px">
        <circle cx="250" cy="292" r="52" fill="none" stroke="var(--tire)" stroke-width="11"/>
        <circle cx="250" cy="292" r="46" fill="none" stroke="#b9c4cb" stroke-width="4"/>
        <use href="#spokes" x="250" y="292"/>
        <circle cx="250" cy="292" r="6" fill="#4a545b"/>
      </g>
      <g class="wheel" style="transform-origin:610px 292px">
        <circle cx="610" cy="292" r="52" fill="none" stroke="var(--tire)" stroke-width="11"/>
        <circle cx="610" cy="292" r="46" fill="none" stroke="#b9c4cb" stroke-width="4"/>
        <use href="#spokes" x="610" y="292"/>
        <circle cx="610" cy="292" r="6" fill="#4a545b"/>
      </g>

      <!-- frame -->
      <g fill="none" stroke="var(--frame)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250 292 L430 292"/>                 <!-- chainstay -->
        <path d="M430 292 L392 196"/>                 <!-- seat tube -->
        <path d="M392 196 L250 292"/>                 <!-- seat stay -->
        <path d="M430 292 L560 240 L566 212"/>        <!-- down tube + head tube -->
        <path d="M566 212 L610 292"/>                 <!-- fork -->
        <path d="M566 212 L596 200" stroke-width="7"/> <!-- stem -->
      </g>
      <path d="M596 200 q14 -2 16 10" fill="none" stroke="#3c464d" stroke-width="7" stroke-linecap="round"/>
      <path d="M378 194 q14 -8 30 -4 l-4 8 q-14 2 -26 0 z" fill="#3c464d"/>
      <path d="M392 196 L386 186" stroke="#3c464d" stroke-width="6" stroke-linecap="round"/>

      <!-- chain + chainring -->
      <g fill="none" stroke="#7c878e" stroke-width="4">
        <path d="M430 270 L250 286 M430 314 L250 298"/>
      </g>
      <g class="crank" style="transform-origin:430px 292px">
        <circle cx="430" cy="292" r="22" fill="none" stroke="#8e979d" stroke-width="4"/>
        <line x1="430" y1="292" x2="464" y2="292" stroke="#3c464d" stroke-width="6" stroke-linecap="round"/>
        <path d="M456 292 h22 l-4 9 h-18 z" fill="#3c464d"/>
      </g>

      <!-- pelican -->
      <g class="pelican">
        <!-- tail -->
        <path d="M304 214 L258 202 L266 222 L302 230 Z" fill="var(--feather2)" stroke="#b7c4cd" stroke-width="2"/>
        <!-- body -->
        <path d="M300 210 C300 176 340 160 380 168 C412 175 428 200 424 226 C420 248 380 254 340 248 C312 244 300 232 300 210 Z"
              fill="url(#body)" stroke="#b7c4cd" stroke-width="2.5"/>
        <!-- wing -->
        <g class="wing">
          <path d="M330 182 C362 172 394 188 398 210 C390 228 352 234 330 222 C318 212 318 192 330 182 Z"
                fill="var(--feather2)" stroke="#b7c4cd" stroke-width="2.5"/>
          <g stroke="#b7c4cd" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M340 224 C352 228 366 228 378 224"/>
            <path d="M336 214 C350 220 366 221 380 216"/>
          </g>
        </g>
        <!-- wing reaching the handlebar -->
        <path d="M392 196 C442 202 502 204 584 202" fill="none" stroke="var(--feather2)" stroke-width="13" stroke-linecap="round"/>
        <path d="M584 202 q10 -4 14 3 q-6 7 -14 4 z" fill="#c2ced6"/>
        <!-- neck -->
        <path d="M392 184 C404 160 424 140 448 132" fill="none" stroke="var(--feather)" stroke-width="19" stroke-linecap="round"/>
        <!-- head -->
        <g class="head">
          <circle cx="458" cy="128" r="22" fill="var(--feather)" stroke="#b7c4cd" stroke-width="2.5"/>
          <path d="M470 122 L556 126 C556 132 552 134 546 134 L472 134 Z" fill="var(--beak)"/>
          <g class="pouch">
            <path d="M472 134 C486 152 512 156 540 148 C548 144 550 138 546 134 Z" fill="url(#pouchG)" stroke="#e0954a" stroke-width="2"/>
          </g>
          <circle cx="466" cy="120" r="4.2" fill="#22282e"/>
          <circle cx="467.5" cy="118.5" r="1.4" fill="#fff"/>
          <path d="M452 112 C456 104 464 102 470 106" fill="none" stroke="#c2ced6" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- near leg (in front of the frame) -->
      <g stroke="#e6eef3" stroke-width="12" stroke-linecap="round" fill="none">
        <g class="thigh"><line x1="415" y1="235" x2="461.7" y2="246.1"/>
          <g class="shank"><line x1="461.7" y1="246.1" x2="464" y2="292"/>
            <path d="M456 292 h22 l-4 10 h-18 z" fill="#dfe7ee" stroke="none"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="toggle" type="button">Pause</button>
    <button id="speed" type="button">Speed: normal</button>
    <span id="state">pedalling…</span>
  </div>
  <p class="note">Pure SVG + CSS keyframes: wheels and crank spin, the legs pedal through a solved four-bar cycle, the pelican bobs, nods, flaps and its pouch wobbles.</p>
</main>
<script>
  const card = document.querySelector('.card');
  const state = document.getElementById('state');
  const toggle = document.getElementById('toggle');
  const speed = document.getElementById('speed');
  let paused = false, fast = false;

  toggle.addEventListener('click', () => {
    paused = !paused;
    card.classList.toggle('paused', paused);
    toggle.textContent = paused ? 'Play' : 'Pause';
    state.textContent = paused ? 'coasting (paused)' : 'pedalling…';
  });
  speed.addEventListener('click', () => {
    fast = !fast;
    document.documentElement.style.setProperty('--spin', fast ? '0.6s' : '1.1s');
    document.documentElement.style.setProperty('--cycle', fast ? '0.9s' : '1.6s');
    speed.textContent = fast ? 'Speed: fast' : 'Speed: normal';
  });
</script>
</body>
</html>
