<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Pelican Riding a Bicycle</title>
<style>
  :root{
    --ink:#e8eef6;
    --muted:#9fb0c3;
    --card:#101722;
    --accent:#f2c14e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Avenir Next",Helvetica,Arial,system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 50% 20%,#1c2735,#0a0f16 70%);
    color:var(--ink);
    display:grid;
    place-items:center;
    padding:24px;
  }
  main{width:min(920px,100%)}
  h1{
    font-size:clamp(20px,3.2vw,30px);
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  h1 span{color:var(--accent)}
  p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  .stage{
    background:var(--card);
    border:1px solid #223041;
    border-radius:16px;
    padding:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  svg{display:block;width:100%;height:auto;border-radius:12px}
  .bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{
    font:inherit;font-size:13px;
    background:#1b2735;color:var(--ink);
    border:1px solid #2b3a4d;border-radius:9px;
    padding:7px 12px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  button[aria-pressed="true"]{background:#243244;color:var(--accent);border-color:var(--accent)}
  .hint{margin-left:auto;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>A pelican <span>riding a bicycle</span></h1>
  <p class="sub">Fully self-contained SVG &mdash; no images, no fonts, no scripts required to animate.</p>

  <div class="stage">
    <svg id="scene" viewBox="0 0 800 420" role="img"
         aria-label="Animated pelican pedalling a bicycle along a road"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b4a6b"/>
          <stop offset="55%" stop-color="#5f8fb0"/>
          <stop offset="100%" stop-color="#a9cfe0"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3c4652"/>
          <stop offset="100%" stop-color="#222a34"/>
        </linearGradient>
        <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff6d8"/>
          <stop offset="60%" stop-color="#f2c14e"/>
          <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
        </radialGradient>

        <!-- one tree, drawn from its base at (0,0) -->
        <g id="tree">
          <rect x="-3" y="-34" width="6" height="34" rx="2" fill="#2f4a3a"/>
          <circle cx="0" cy="-46" r="17" fill="#3d6b52"/>
          <circle cx="-11" cy="-38" r="12" fill="#355e48"/>
          <circle cx="11" cy="-39" r="11" fill="#457a5d"/>
        </g>

        <!-- one grass tuft -->
        <g id="tuft">
          <path d="M0 0 L-5 -11 M0 0 L0 -14 M0 0 L6 -10"
                stroke="#4f7d5e" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </g>

        <!-- one cloud -->
        <g id="cloud">
          <path d="M0 0 h46 a14 14 0 0 1 0 28 h-64 a14 14 0 0 1 0 -28 h18 z"
                fill="#dceaf5" opacity=".55"/>
        </g>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="800" height="340" fill="url(#sky)"/>

      <!-- sun -->
      <circle cx="640" cy="90" r="46" fill="url(#sunG)">
        <animate attributeName="r" values="44;50;44" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- drifting clouds -->
      <g fill="#dceaf5">
        <use href="#cloud" y="70"><animateTransform attributeName="transform" type="translate"
          values="820 0; -120 0" dur="42s" begin="-6s" repeatCount="indefinite"/></use>
        <use href="#cloud" y="120"><animateTransform attributeName="transform" type="translate"
          values="820 0; -120 0" dur="55s" begin="-30s" repeatCount="indefinite"/></use>
        <use href="#cloud" y="46"><animateTransform attributeName="transform" type="translate"
          values="820 0; -120 0" dur="68s" begin="-48s" repeatCount="indefinite"/></use>
      </g>

      <!-- distant hills, slow parallax -->
      <g>
        <path d="M0 300 Q100 262 200 300 Q300 268 400 300 Q500 262 600 300 Q700 268 800 300
                 Q900 262 1000 300 Q1100 268 1200 300 L1200 340 L0 340 Z"
              fill="#3f6b55" opacity=".75"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -400 0" dur="3.33s" repeatCount="indefinite"/>
      </g>

      <!-- trees scrolling at road speed -->
      <g>
        <use href="#tree" x="40"   y="340"/><use href="#tree" x="240"  y="340"/>
        <use href="#tree" x="440"  y="340"/><use href="#tree" x="640"  y="340"/>
        <use href="#tree" x="840"  y="340"/><use href="#tree" x="1040" y="340"/>
        <use href="#tree" x="1240" y="340"/><use href="#tree" x="1440" y="340"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -200 0" dur="0.566s" repeatCount="indefinite"/>
      </g>

      <!-- road -->
      <rect x="0" y="340" width="800" height="80" fill="url(#road)"/>
      <line x1="-100" y1="372" x2="900" y2="372" stroke="#f2c14e" stroke-width="5"
           stroke-dasharray="30 40" stroke-linecap="round" opacity=".85">
        <animate attributeName="stroke-dashoffset" values="0;70" dur="0.198s" repeatCount="indefinite"/>
      </line>
      <g>
        <use href="#tuft" x="20"  y="340"/><use href="#tuft" x="120" y="340"/>
        <use href="#tuft" x="220" y="340"/><use href="#tuft" x="320" y="340"/>
        <use href="#tuft" x="420" y="340"/><use href="#tuft" x="520" y="340"/>
        <use href="#tuft" x="620" y="340"/><use href="#tuft" x="720" y="340"/>
        <use href="#tuft" x="820" y="340"/><use href="#tuft" x="920" y="340"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -100 0" dur="0.283s" repeatCount="indefinite"/>
      </g>

      <!-- shadow -->
      <ellipse cx="375" cy="341" rx="168" ry="9" fill="#0b1118" opacity=".35">
        <animate attributeName="rx" values="168;160;168" dur="0.8s" repeatCount="indefinite"/>
      </ellipse>

      <!-- speed lines -->
      <g stroke="#cfe3f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".55">
        <path d="M150 150 h44"><animate attributeName="opacity" values=".1;.6;.1" dur="0.9s" repeatCount="indefinite"/></path>
        <path d="M120 178 h58"><animate attributeName="opacity" values=".5;.1;.5" dur="1.1s" repeatCount="indefinite"/></path>
        <path d="M160 205 h40"><animate attributeName="opacity" values=".1;.5;.1" dur="0.7s" repeatCount="indefinite"/></path>
      </g>

      <!-- ================= BICYCLE ================= -->
      <g stroke-linecap="round" stroke-linejoin="round">

        <!-- rear wheel -->
        <g>
          <circle cx="230" cy="295" r="45" fill="none" stroke="#111720" stroke-width="9"/>
          <circle cx="230" cy="295" r="40" fill="none" stroke="#7d8b9b" stroke-width="3"/>
          <g stroke="#9fb0c3" stroke-width="1.8">
            <path d="M230 295 L270 295 M230 295 L264.6 315 M230 295 L250 329.6 M230 295 L230 335
                     M230 295 L210 329.6 M230 295 L195.4 315 M230 295 L190 295 M230 295 L195.4 275
                     M230 295 L210 260.4 M230 295 L230 255 M230 295 L250 260.4 M230 295 L264.6 275"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0 230 295" to="360 230 295" dur="0.8s" repeatCount="indefinite"/>
          </g>
          <circle cx="230" cy="295" r="5" fill="#cfd8e3"/>
        </g>

        <!-- front wheel -->
        <g>
          <circle cx="520" cy="295" r="45" fill="none" stroke="#111720" stroke-width="9"/>
          <circle cx="520" cy="295" r="40" fill="none" stroke="#7d8b9b" stroke-width="3"/>
          <g stroke="#9fb0c3" stroke-width="1.8">
            <path d="M520 295 L560 295 M520 295 L554.6 315 M520 295 L540 329.6 M520 295 L520 335
                     M520 295 L500 329.6 M520 295 L485.4 315 M520 295 L480 295 M520 295 L485.4 275
                     M520 295 L500 260.4 M520 295 L520 255 M520 295 L540 260.4 M520 295 L554.6 275"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0 520 295" to="360 520 295" dur="0.8s" repeatCount="indefinite"/>
          </g>
          <circle cx="520" cy="295" r="5" fill="#cfd8e3"/>
        </g>

        <!-- frame -->
        <g stroke="#e05a45" stroke-width="7" fill="none">
          <path d="M230 295 L360 290"/>            <!-- chainstay -->
          <path d="M230 295 L300 200"/>            <!-- seat stay -->
          <path d="M300 200 L360 290"/>            <!-- seat tube -->
          <path d="M360 290 L488 240 L505 200"/>   <!-- down tube + head tube -->
          <path d="M505 200 L520 295"/>            <!-- fork -->
          <path d="M505 200 L478 190"/>            <!-- stem -->
        </g>
        <path d="M478 190 q-14 -2 -16 12" stroke="#2b3440" stroke-width="6" fill="none"/>
        <circle cx="462" cy="202" r="4" fill="#f2c14e"/>   <!-- bell -->

        <!-- pennant on the seat post -->
        <g>
          <path d="M300 200 L292 186" stroke="#2b3440" stroke-width="3" fill="none"/>
          <path d="M292 186 L262 180 L292 194 Z" fill="#f2c14e">
            <animateTransform attributeName="transform" type="rotate"
              values="0 292 186; -8 292 186; 4 292 186; 0 292 186" dur="1.2s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- saddle -->
        <path d="M278 202 C286 194 312 194 322 200 L318 205 C304 203 290 205 278 205 Z" fill="#2b3440"/>

        <!-- chain -->
        <path d="M230 285 L358 268 A22 22 0 0 1 362 312 L232 305 A10 10 0 0 0 230 285 Z"
              fill="none" stroke="#8b98a8" stroke-width="4" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" values="0;10" dur="0.116s" repeatCount="indefinite"/>
        </path>

        <!-- far crank + far pedal -->
        <g stroke="#5b6a7a" stroke-width="5" fill="none">
          <path d="M360 290 L325 290">
            <animateTransform attributeName="transform" type="rotate"
              from="180 360 290" to="540 360 290" dur="1.6s" repeatCount="indefinite"/>
          </path>
        </g>
        <g>
          <rect x="316" y="288" width="18" height="4" rx="2" fill="#5b6a7a"/>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; -24.75 -24.75; 0 -35; 24.75 -24.75; 35 0; 24.75 24.75; 0 35; -24.75 24.75; 0 0"
            dur="1.6s" calcMode="linear" repeatCount="indefinite"/>
        </g>

        <!-- chainring -->
        <g>
          <circle cx="360" cy="290" r="22" fill="none" stroke="#8b98a8" stroke-width="3"/>
          <g stroke="#8b98a8" stroke-width="2">
            <path d="M360 290 L382 290 M360 290 L371 309 M360 290 L349 309 M360 290 L338 290
                     M360 290 L349 271 M360 290 L371 271"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0 360 290" to="360 360 290" dur="1.6s" repeatCount="indefinite"/>
          </g>
        </g>
      </g>

      <!-- ================= PELICAN ================= -->

      <!-- far leg -->
      <path fill="none" stroke="#b98a4e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
            d="M292 197 L259.1 261 L325 290">
        <animate attributeName="d" dur="1.6s" calcMode="linear" repeatCount="indefinite"
          values="M292 197 L259.1 261 L325 290;
                  M292 197 L263.3 263 L335.3 265.3;
                  M292 197 L289.4 269 L360 255;
                  M292 197 L312.8 265.9 L384.7 265.3;
                  M292 197 L330.6 257.8 L395 290;
                  M292 197 L336.5 253.6 L384.7 314.7;
                  M292 197 L325.8 260.6 L360 325;
                  M292 197 L280.4 268.1 L335.3 314.7;
                  M292 197 L259.1 261 L325 290"/>
      </path>

      <!-- body group (gentle bob in time with the cranks) -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 2 3; 0 0; -2 -3; 0 0" dur="1.6s" calcMode="linear" repeatCount="indefinite"/>

        <!-- tail -->
        <g>
          <path d="M240 172 L206 162 L212 186 L242 190 Z" fill="#dfe6ee"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 242 180; -6 242 180; 2 242 180; 0 242 180" dur="1.6s" repeatCount="indefinite"/>
        </g>

        <!-- body -->
        <path d="M240 176 C244 146 272 130 314 132 C352 134 370 152 368 174
                 C366 196 342 208 306 208 C272 208 246 194 240 176 Z" fill="#eef3f8"/>
        <path d="M240 176 C244 146 272 130 314 132 C352 134 370 152 368 174
                 C366 196 342 208 306 208 C272 208 246 194 240 176 Z"
              fill="none" stroke="#c3d0dd" stroke-width="2"/>

        <!-- neck -->
        <path d="M352 152 C372 140 392 128 412 120" fill="none" stroke="#eef3f8"
              stroke-width="15" stroke-linecap="round">
          <animate attributeName="stroke-width" values="15;16;15" dur="1.6s" repeatCount="indefinite"/>
        </path>

        <!-- head -->
        <g>
          <circle cx="425" cy="118" r="17" fill="#eef3f8" stroke="#c3d0dd" stroke-width="2"/>

          <!-- upper mandible -->
          <path d="M440 112 L508 121 L442 124 Z" fill="#f2c14e" stroke="#d9a53a" stroke-width="1.5"/>

          <!-- pouch, breathing -->
          <path fill="#f2c14e" stroke="#d9a53a" stroke-width="1.5"
                d="M441 127 C452 150 472 150 486 130 C470 128 455 126 441 127 Z">
            <animate attributeName="d" dur="1.6s" calcMode="linear" repeatCount="indefinite"
              values="M441 127 C452 150 472 150 486 130 C470 128 455 126 441 127 Z;
                      M441 127 C448 141 466 141 486 130 C470 128 455 126 441 127 Z;
                      M441 127 C452 150 472 150 486 130 C470 128 455 126 441 127 Z"/>
          </path>

          <!-- a little fish still in the pouch -->
          <g>
            <path d="M478 141 L492 136 L486 146 Z" fill="#8fb3d9">
              <animateTransform attributeName="transform" type="rotate"
                values="0 478 141; 12 478 141; -10 478 141; 0 478 141" dur="0.9s" repeatCount="indefinite"/>
            </path>
          </g>

          <!-- eye + blink -->
          <circle cx="430" cy="113" r="3.6" fill="#1b2430"/>
          <circle cx="431.2" cy="111.8" r="1.1" fill="#fff"/>
          <path d="M424 113 h12" stroke="#eef3f8" stroke-width="4" stroke-linecap="round" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.86;0.9;0.94;1"
                     dur="4s" repeatCount="indefinite"/>
          </path>

          <!-- head bob -->
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 3 2; 0 0; -3 -2; 0 0" dur="1.6s" calcMode="linear" repeatCount="indefinite"/>
        </g>

        <!-- flapping wing -->
        <g>
          <path d="M318 148 C292 150 262 166 250 186 C268 192 296 184 318 166 Z"
                fill="#dbe4ee" stroke="#c3d0dd" stroke-width="2"/>
          <path d="M262 180 C276 178 292 172 306 164" fill="none" stroke="#b6c4d2" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 318 150; -10 318 150; 4 318 150; 0 318 150" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- near crank -->
      <g stroke="#8b98a8" stroke-width="5" fill="none">
        <path d="M360 290 L395 290">
          <animateTransform attributeName="transform" type="rotate"
            from="0 360 290" to="360 360 290" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- near leg (inverse-kinematics keyframes, in step with the crank) -->
      <path fill="none" stroke="#d9a53a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
            d="M300 200 L322.3 271.6 L395 290">
        <animate attributeName="d" dur="1.6s" calcMode="linear" repeatCount="indefinite"
          values="M300 200 L322.3 271.6 L395 290;
                  M300 200 L323.7 271.1 L384.7 314.7;
                  M300 200 L304.2 274.9 L360 325;
                  M300 200 L274.6 270.6 L335.3 314.7;
                  M300 200 L256 260.7 L325 290;
                  M300 200 L260.3 263.6 L335.3 265.3;
                  M300 200 L287.4 273.9 L360 255;
                  M300 200 L310.3 274.3 L384.7 265.3;
                  M300 200 L322.3 271.6 L395 290"/>
      </path>

      <!-- webbed foot on the near pedal -->
      <g>
        <path d="M395 287 L414 292 L396 296 L388 292 Z" fill="#d9a53a"/>
        <rect x="386" y="288" width="18" height="4" rx="2" fill="#8b98a8" opacity=".6"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 24.75 24.75; 0 35; -24.75 24.75; -35 0; -24.75 -24.75; 0 -35; 24.75 -24.75; 0 0"
          dur="1.6s" calcMode="linear" repeatCount="indefinite"/>
      </g>
    </svg>

    <div class="bar">
      <button id="toggle" type="button">Pause</button>
      <button id="slow" type="button" aria-pressed="false">Slow motion</button>
      <span class="hint">Speeds are consistent: wheel &rarr; road &rarr; scenery all move at 353&nbsp;px/s.</span>
    </div>
  </div>
</main>

<script>
  const svg = document.getElementById('scene');
  const toggle = document.getElementById('toggle');
  const slow = document.getElementById('slow');
  let paused = false, rate = 1;

  toggle.addEventListener('click', () => {
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    toggle.textContent = paused ? 'Play' : 'Pause';
  });

  slow.addEventListener('click', () => {
    rate = (rate === 1) ? 0.35 : 1;
    slow.setAttribute('aria-pressed', rate !== 1);
    try { svg.setCurrentRate(rate); } catch (e) { /* not supported: animation just runs at 1x */ }
  });
</script>
</body>
</html>
