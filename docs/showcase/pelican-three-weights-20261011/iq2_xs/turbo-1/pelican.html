<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pelican Riding a Bicycle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#10161d; --paper:#f4f1e8; --accent:#e8632f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 20%, #2b3542, #171d24 60%, #12171d);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#e9eef5; padding:24px;
  }
  .card{
    width:min(960px,100%); background:var(--paper); color:var(--ink);
    border-radius:18px; padding:22px 22px 16px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.15);
  }
  h1{margin:0 0 4px; font-size:20px; letter-spacing:.02em}
  p.sub{margin:0 0 14px; font-size:13px; color:#5b6570}
  svg{display:block; width:100%; height:auto; border-radius:12px; background:#dfeaf3}
  .foot{margin:12px 2px 0; font-size:12px; color:#6b7480; display:flex; justify-content:space-between}
  .foot b{color:var(--accent)}
  .badge{display:inline-block; padding:2px 8px; border-radius:999px; background:#e8e3d6; font-size:11px}
</style>
</head>
<body>
  <main class="card">
    <h1>Pelican Riding a Bicycle</h1>
    <p class="sub">Pure SVG + SMIL animation — self-contained, no scripts, no external assets.</p>
    <svg viewBox="0 0 900 460" role="img" aria-label="Animated pelican riding a bicycle">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b9d7ea"/>
          <stop offset="0.62" stop-color="#e4eef6"/>
          <stop offset="1" stop-color="#f3f6f2"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d9399"/>
          <stop offset="1" stop-color="#6c7278"/>
        </linearGradient>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e8632f"/>
          <stop offset="1" stop-color="#b53f16"/>
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#fbf8f1"/>
          <stop offset="1" stop-color="#d5d0c2"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e9e4d7"/>
          <stop offset="1" stop-color="#b9b3a3"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6d3ad"/>
          <stop offset="1" stop-color="#e0a970"/>
        </linearGradient>
        <radialGradient id="tyre" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.72" stop-color="#eef3f7" stop-opacity="0"/>
          <stop offset="0.73" stop-color="#23282e"/>
          <stop offset="1" stop-color="#1a1f24"/>
        </radialGradient>
        <g id="bush">
          <ellipse cx="0" cy="14" rx="26" ry="12" fill="#3f6b46" opacity=".25"/>
          <circle cx="-14" cy="0" r="16" fill="#4c8157"/>
          <circle cx="8" cy="-8" r="19" fill="#57925f"/>
          <circle cx="22" cy="2" r="14" fill="#457550"/>
        </g>
        <g id="tree">
          <rect x="-4" y="-46" width="8" height="46" rx="3" fill="#6b5a45"/>
          <circle cx="0" cy="-62" r="26" fill="#4f8258"/>
          <circle cx="-18" cy="-52" r="18" fill="#446f4e"/>
          <circle cx="16" cy="-54" r="16" fill="#5a8f62"/>
        </g>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="900" height="460" fill="url(#sky)"/>
      <circle cx="742" cy="72" r="34" fill="#fff6d8" opacity=".85"/>
      <circle cx="742" cy="72" r="52" fill="#fff6d8" opacity=".22"/>

      <!-- far hills -->
      <path d="M0 300 L120 250 L210 288 L330 240 L450 292 L560 252 L690 296 L810 258 L900 292 L900 460 L0 460 Z"
            fill="#c6d8c8" opacity=".7"/>
      <path d="M0 330 L140 300 L260 336 L400 302 L520 338 L660 306 L780 340 L900 312 L900 460 L0 460 Z"
            fill="#b7c9bb" opacity=".8"/>

      <!-- scrolling scenery -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -390 0" dur="2.6s" repeatCount="indefinite"/>
        <g>
          <use href="#tree" x="60"  y="352"/>
          <use href="#bush" x="150" y="356"/>
          <use href="#tree" x="250" y="352"/>
          <use href="#bush" x="330" y="356"/>
        </g>
        <g>
          <use href="#tree" x="450" y="352"/>
          <use href="#bush" x="540" y="356"/>
          <use href="#tree" x="640" y="352"/>
          <use href="#bush" x="720" y="356"/>
        </g>
      </g>

      <!-- road -->
      <rect x="0" y="378" width="900" height="42" fill="url(#road)"/>
      <line x1="0" y1="378" x2="900" y2="378" stroke="#4d545b" stroke-width="3"/>
      <g stroke="#f2f4f6" stroke-width="4" stroke-linecap="round" opacity=".85">
        <line x1="0" y1="399" x2="900" y2="399" stroke-dasharray="34 46" stroke-dashoffset="0">
          <animate attributeName="stroke-dashoffset" values="0;80" dur="0.533s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- speed lines -->
      <g stroke="#7f93a4" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -160 0" dur="1.1s" repeatCount="indefinite"/>
        <line x1="120" y1="150" x2="190" y2="150">
          <animate attributeName="opacity" values="0;.9;0" dur="1.1s" repeatCount="indefinite"/>
        </line>
        <line x1="60" y1="205" x2="150" y2="205">
          <animate attributeName="opacity" values="0;.8;0" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
        </line>
        <line x1="140" y1="262" x2="205" y2="262">
          <animate attributeName="opacity" values="0;.7;0" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- contact shadow -->
      <ellipse cx="460" cy="384" rx="180" ry="12" fill="#2f363c" opacity=".28"/>

      <!-- ============ BICYCLE ============ -->
      <g id="bike">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -4; 0 0; 0 -3; 0 0" dur="0.8s" repeatCount="indefinite"/>

        <!-- far crank + pedal -->
        <g transform="translate(470,318)">
          <animateTransform attributeName="transform" type="rotate"
            values="180;225;270;315;0;45;90;135;180" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
            dur="0.8s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="-38" y2="0" stroke="#7c848c" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(-38,0)">
            <animateTransform attributeName="transform" type="rotate"
              values="-180;-225;-270;-315;0;-45;-90;-135;-180"
              keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
            <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#5c656d"/>
          </g>
        </g>

        <!-- rear wheel -->
        <g transform="translate(300,318)">
          <circle r="62" fill="url(#tyre)"/>
          <circle r="55" fill="#eef3f7" opacity=".55"/>
          <g stroke="#9aa4ad" stroke-width="3" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate"
              values="0;360" dur="2.6s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="55" y2="0"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(60)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(120)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(180)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(240)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(300)"/>
          </g>
          <circle r="7" fill="#3b4249"/>
        </g>

        <!-- front wheel -->
        <g transform="translate(620,318)">
          <circle r="62" fill="url(#tyre)"/>
          <circle r="55" fill="#eef3f7" opacity=".55"/>
          <g stroke="#9aa4ad" stroke-width="3" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate"
              values="0;360" dur="2.6s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="55" y2="0"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(60)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(120)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(180)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(240)"/>
            <line x1="0" y1="0" x2="55" y2="0" transform="rotate(300)"/>
          </g>
          <circle r="7" fill="#3b4249"/>
        </g>

        <!-- chain -->
        <path d="M300 306 L470 296 A22 22 0 0 1 470 340 L300 330 A12 12 0 0 1 300 306 Z"
              fill="none" stroke="#454d54" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="6 5">
          <animate attributeName="stroke-dashoffset" values="0;110" dur="0.8s" repeatCount="indefinite"/>
        </path>
        <circle cx="470" cy="318" r="22" fill="none" stroke="#59626a" stroke-width="4"/>
        <circle cx="300" cy="318" r="12" fill="none" stroke="#59626a" stroke-width="4"/>

        <!-- frame -->
        <g fill="none" stroke="url(#frame)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M300 318 L415 232"/>            <!-- seat stay -->
          <path d="M415 232 L470 318"/>            <!-- seat tube -->
          <path d="M470 318 L592 228"/>            <!-- down tube -->
          <path d="M592 228 L620 318"/>            <!-- fork -->
          <path d="M470 318 L300 318"/>            <!-- chain stay -->
        </g>
        <path d="M592 228 L566 212" stroke="#2f363c" stroke-width="7" stroke-linecap="round"/>
        <path d="M566 212 q-14 -4 -22 4" fill="none" stroke="#2f363c" stroke-width="7" stroke-linecap="round"/>
        <path d="M415 232 q-16 -6 -34 -4" fill="none" stroke="#2f363c" stroke-width="6" stroke-linecap="round"/>

        <!-- saddle -->
        <path d="M381 228 q22 -10 44 -2 q-4 8 -22 8 q-16 0 -22 -6 Z" fill="#2f363c"/>

        <!-- near crank + pedal -->
        <g transform="translate(470,318)">
          <animateTransform attributeName="transform" type="rotate"
            values="0;45;90;135;180;225;270;315;0" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
            dur="0.8s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="38" y2="0" stroke="#3b4249" stroke-width="6" stroke-linecap="round"/>
          <g transform="translate(38,0)">
            <animateTransform attributeName="transform" type="rotate"
              values="0;-45;-90;-135;-180;-225;-270;-315;0"
              keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
            <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#2f363c"/>
          </g>
        </g>

      <!-- ============ PELICAN ============ -->
      <g id="pelican">
        <!-- far leg -->
        <g transform="translate(420,238)" stroke="#a9a292" stroke-width="11" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" additive="sum"
              values="147.2;147.8;115.1;91.6;81.8;82.3;98.3;124.3;147.2"
              keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="65" y2="0"/>
            <g transform="translate(65,0)">
              <animateTransform attributeName="transform" type="rotate" additive="sum"
                values="-112.4;-135.1;-129.7;-102.3;-71.3;-49.6;-54.7;-81.3;-112.4"
                keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
              <line x1="0" y1="0" x2="75" y2="0"/>
              <path d="M75 0 l16 6 l-6 -12" stroke-width="6"/>
            </g>
          </g>
        </g>

        <!-- tail feathers -->
        <g transform="translate(322,196)">
          <animateTransform attributeName="transform" type="rotate" additive="sum"
            values="0;-6;0;4;0" dur="1.6s" repeatCount="indefinite"/>
          <path d="M0 0 L-58 -18 L-52 -4 L-62 6 L-40 8 L-52 20 L-24 14 Z" fill="url(#wingGrad)"/>
        </g>

        <!-- body -->
        <path d="M320 200 C320 158 352 140 392 142 C432 144 454 166 454 192
               C454 216 432 234 396 234 C356 234 320 224 320 200 Z" fill="url(#feather)"/>
        <path d="M336 214 C360 226 400 230 430 220" fill="none" stroke="#c3bcae" stroke-width="3" opacity=".7"/>

        <!-- neck -->
        <path d="M438 172 C468 158 496 140 512 122" fill="none" stroke="url(#feather)"
              stroke-width="24" stroke-linecap="round"/>

        <!-- head + beak -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 3 -4; 0 0; -2 3; 0 0" dur="1.6s" repeatCount="indefinite"/>
          <circle cx="516" cy="120" r="19" fill="url(#feather)"/>
          <path d="M512 112 C540 112 574 116 596 122 L596 126 C572 128 540 128 514 126 Z" fill="#e9e3d4"/>
          <path d="M514 126 C540 130 566 136 596 126 C592 146 566 156 536 152 C520 150 512 140 514 126 Z" fill="url(#pouch)">
            <animate attributeName="d"
              values="M514 126 C540 130 566 136 596 126 C592 146 566 156 536 152 C520 150 512 140 514 126 Z;
                      M514 126 C540 132 566 142 596 126 C590 152 564 164 534 158 C518 154 512 140 514 126 Z;
                      M514 126 C540 130 566 136 596 126 C592 146 566 156 536 152 C520 150 512 140 514 126 Z"
              dur="1.6s" repeatCount="indefinite"/>
          </path>
          <line x1="514" y1="126" x2="596" y2="124" stroke="#b9b1a2" stroke-width="2"/>
          <circle cx="512" cy="114" r="4.5" fill="#22282e"/>
          <circle cx="513.5" cy="112.5" r="1.4" fill="#fff"/>
          <path d="M504 106 C512 102 522 104 526 110" fill="none" stroke="#c3bcae" stroke-width="2.5"/>
        </g>

        <!-- wing reaching the handlebar -->
        <path fill="url(#wingGrad)" stroke="#b1a998" stroke-width="2">
          <animate attributeName="d"
            values="M398 170 C432 166 468 180 498 196 C520 206 544 210 564 212 L568 218 C542 226 506 228 470 222 C436 216 404 206 392 192 Z;
                    M398 170 C432 168 468 184 498 200 C520 210 544 212 564 212 L568 218 C542 228 506 230 470 224 C436 218 404 208 392 192 Z;
                    M398 170 C432 166 468 180 498 196 C520 206 544 210 564 212 L568 218 C542 226 506 228 470 222 C436 216 404 206 392 192 Z"
            dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M412 186 C444 196 480 208 512 214" fill="none" stroke="#b1a998" stroke-width="2" opacity=".8"/>
        <path d="M404 196 C436 206 470 218 500 222" fill="none" stroke="#b1a998" stroke-width="2" opacity=".6"/>

        <!-- near leg -->
        <g transform="translate(425,240)" stroke="#d8d1c2" stroke-width="12" stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate" additive="sum"
              values="81.8;82.3;98.3;124.3;147.2;147.8;115.1;91.6;81.8"
              keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="65" y2="0"/>
            <circle cx="65" cy="0" r="6" fill="#d8d1c2" stroke="none"/>
            <g transform="translate(65,0)">
              <animateTransform attributeName="transform" type="rotate" additive="sum"
                values="-71.3;-49.6;-54.7;-81.3;-112.4;-135.1;-129.7;-102.3;-71.3"
                keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="0.8s" repeatCount="indefinite"/>
              <line x1="0" y1="0" x2="75" y2="0"/>
              <path d="M75 0 l18 7 l-7 -13" stroke-width="6"/>
            </g>
          </g>
        </g>
      </g>
      </g>
    </svg>
    <div class="foot">
      <span><b>Wheels</b> 2.6&nbsp;s / rev &nbsp;·&nbsp; <b>Crank</b> 0.8&nbsp;s / rev &nbsp;·&nbsp; legs solved by 8-point IK keyframes</span>
      <span class="badge">SMIL only</span>
    </div>
  </main>
</body>
</html>
