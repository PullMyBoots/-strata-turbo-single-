<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican Riding a Bicycle — self-contained SVG animation</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2b; --line:#27324a; --ink:#e9eef7; --muted:#9fb0c6; --accent:#f4a259;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px 18px; background:radial-gradient(1100px 700px at 50% -10%, #1b2434, var(--bg));
    color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:min(940px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  h1{margin:0 0 4px; font-size:20px; letter-spacing:.2px}
  .sub{margin:0 0 16px; color:var(--muted); font-size:13.5px}
  svg{display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line)}
  .controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px}
  button{
    appearance:none; border:1px solid var(--line); background:#1d2634; color:var(--ink);
    padding:8px 14px; border-radius:10px; font:inherit; font-size:13.5px; cursor:pointer;
  }
  button:hover{background:#243041}
  button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#1a1206}
  .hint{margin-top:10px; color:var(--muted); font-size:12.5px}
</style>
</head>
<body>
  <main class="card">
    <h1>Pelican riding a bicycle</h1>
    <p class="sub">One self-contained HTML file — pure SVG + SMIL, no external assets.</p>

    <svg id="scene" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="A pelican pedalling a bicycle along a road">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#a6d7ef"/>
          <stop offset="60%" stop-color="#d7ecf6"/>
          <stop offset="100%" stop-color="#eef6f2"/>
        </linearGradient>
        <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#4b5663"/>
          <stop offset="100%" stop-color="#39434e"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#fff6cf" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#fff6cf" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="800" height="420" fill="url(#sky)"/>

      <!-- sun -->
      <g>
        <circle cx="120" cy="92" r="72" fill="url(#sunGlow)"/>
        <circle cx="120" cy="92" r="26" fill="#ffd86b"/>
        <g stroke="#ffd86b" stroke-width="3" stroke-linecap="round" opacity=".7">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 120 92" to="360 120 92" dur="24s" repeatCount="indefinite"/>
            <path d="M120 58 L120 46 M120 126 L120 138 M86 92 L74 92 M154 92 L166 92
                     M96 68 L88 60 M144 116 L152 124 M144 68 L152 60 M96 116 L88 124"/>
          </g>
        </g>
      </g>

      <!-- clouds -->
      <g fill="#ffffff" opacity=".85">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="860,60;-220,60" dur="38s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="15"/><circle cx="22" cy="-7" r="19"/><circle cx="45" cy="0" r="13"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="860,110;-220,110" dur="52s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="12"/><circle cx="18" cy="-6" r="15"/><circle cx="36" cy="0" r="11"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="860,38;-220,38" dur="66s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="18"/><circle cx="26" cy="-8" r="22"/><circle cx="52" cy="0" r="15"/>
        </g>
      </g>

      <!-- far hills (seamless loop, period 800) -->
      <g fill="#c6dfcc">
        <animateTransform attributeName="transform" type="translate"
          values="0,0;-800,0" dur="24s" repeatCount="indefinite"/>
        <path d="M0 252 Q100 206 200 252 Q300 214 400 252 Q500 196 600 252 Q700 222 800 252 L800 330 L0 330 Z"/>
        <path d="M800 252 Q900 206 1000 252 Q1100 214 1200 252 Q1300 196 1400 252 Q1500 222 1600 252 L1600 330 L800 330 Z"/>
      </g>

      <!-- near hills -->
      <g fill="#a5d3b6">
        <animateTransform attributeName="transform" type="translate"
          values="0,0;-800,0" dur="12s" repeatCount="indefinite"/>
        <path d="M0 292 Q120 254 240 292 Q360 266 480 292 Q600 248 720 292 Q770 280 800 292 L800 330 L0 330 Z"/>
        <path d="M800 292 Q920 254 1040 292 Q1160 266 1280 292 Q1400 248 1520 292 Q1570 280 1600 292 L1600 330 L800 330 Z"/>
      </g>

      <!-- road -->
      <rect x="0" y="330" width="800" height="60" fill="url(#asphalt)"/>
      <line x1="0" y1="330.5" x2="800" y2="330.5" stroke="#5f6c79" stroke-width="3"/>
      <path d="M-100 362 L900 362" stroke="#f4d35e" stroke-width="5" stroke-linecap="butt"
            stroke-dasharray="40 54.23">
        <animate attributeName="stroke-dashoffset" values="0;282.7" dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- grass verge with looping tufts -->
      <rect x="0" y="390" width="800" height="30" fill="#86c39a"/>
      <g fill="#6faa82">
        <animateTransform attributeName="transform" type="translate"
          values="0,0;-282.7,0" dur="1s" repeatCount="indefinite"/>
        <g>
          <path d="M0 418 L3 404 L6 418 Z"/><path d="M94.2 418 L97.2 404 L100.2 418 Z"/>
          <path d="M188.5 418 L191.5 404 L194.5 418 Z"/><path d="M282.7 418 L285.7 404 L288.7 418 Z"/>
          <path d="M376.9 418 L379.9 404 L382.9 418 Z"/><path d="M471.2 418 L474.2 404 L477.2 418 Z"/>
          <path d="M565.4 418 L568.4 404 L571.4 418 Z"/><path d="M659.6 418 L662.6 404 L665.6 418 Z"/>
          <path d="M753.8 418 L756.8 404 L759.8 418 Z"/><path d="M848.1 418 L851.1 404 L854.1 418 Z"/>
          <path d="M942.3 418 L945.3 404 L948.3 418 Z"/>
        </g>
      </g>

      <!-- speed streaks -->
      <g stroke="#7fb6d8" stroke-width="3" stroke-linecap="round" fill="none">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0,0;-60,0" dur="0.7s" repeatCount="indefinite"/>
          <path d="M150 150 L205 150"><animate attributeName="opacity" values="0;.8;0" dur="0.7s" repeatCount="indefinite"/></path>
          <path d="M120 196 L185 196"><animate attributeName="opacity" values=".7;0;.7" dur="0.7s" repeatCount="indefinite"/></path>
          <path d="M160 244 L210 244"><animate attributeName="opacity" values="0;.6;0" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/></path>
        </g>
      </g>

      <!-- ============ rider ============ -->
      <g id="rider">
        <ellipse cx="360" cy="333" rx="145" ry="9" fill="#000" opacity=".16"/>

        <g>
          <!-- gentle bob at the pedalling cadence -->
          <animateTransform attributeName="transform" type="translate"
            values="0,0; 0,-2.5; 0,0; 0,-1.5; 0,0" keyTimes="0;0.25;0.5;0.75;1"
            dur="1s" repeatCount="indefinite"/>

          <!-- far leg (behind the bike) -->
          <g stroke="#66757f" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M345 220 L376.5 256.2 L338 294">
              <animate attributeName="d" dur="1s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                values="M345 220 L376.5 256.2 L338 294;M345 220 L386.3 244.4 L344.4 278.4;M345 220 L392.2 228.7 L360 272;M345 220 L392.5 227.2 L375.6 278.4;M345 220 L388.5 240.4 L382 294;M345 220 L377.2 255.6 L375.6 309.6;M345 220 L367.3 262.5 L360 316;M345 220 L369.1 261.5 L344.4 309.6;M345 220 L376.5 256.2 L338 294"/>
            </path>
          </g>
          <g fill="#c9764f">
            <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
              values="338,294;344.4,278.4;360,272;375.6,278.4;382,294;375.6,309.6;360,316;344.4,309.6;338,294"/>
            <path d="M0 0 L14 3 L12 9 L-2 7 Z"/>
          </g>

          <!-- wheels -->
          <g>
            <circle cx="270" cy="285" r="45" fill="none" stroke="#2f3a46" stroke-width="7"/>
            <circle cx="270" cy="285" r="41" fill="none" stroke="#9fb3c8" stroke-width="2.5"/>
            <g stroke="#9fb3c8" stroke-width="1.6">
              <animateTransform attributeName="transform" type="rotate"
                from="0 270 285" to="360 270 285" dur="1s" repeatCount="indefinite"/>
              <path d="M270 285 L310 285 M270 285 L298.3 313.3 M270 285 L270 325 M270 285 L241.7 313.3
                       M270 285 L230 285 M270 285 L241.7 256.7 M270 285 L270 245 M270 285 L298.3 256.7"/>
            </g>
            <circle cx="270" cy="285" r="5" fill="#9fb3c8"/>
          </g>
          <g>
            <circle cx="450" cy="285" r="45" fill="none" stroke="#2f3a46" stroke-width="7"/>
            <circle cx="450" cy="285" r="41" fill="none" stroke="#9fb3c8" stroke-width="2.5"/>
            <g stroke="#9fb3c8" stroke-width="1.6">
              <animateTransform attributeName="transform" type="rotate"
                from="0 450 285" to="360 450 285" dur="1s" repeatCount="indefinite"/>
              <path d="M450 285 L490 285 M450 285 L478.3 313.3 M450 285 L450 325 M450 285 L421.7 313.3
                       M450 285 L410 285 M450 285 L421.7 256.7 M450 285 L450 245 M450 285 L478.3 256.7"/>
            </g>
            <circle cx="450" cy="285" r="5" fill="#9fb3c8"/>
          </g>

          <!-- frame -->
          <g stroke="#e0554f" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M360 294 L270 285"/>
            <path d="M360 294 L330 236"/>
            <path d="M270 285 L330 236"/>
            <path d="M330 236 L428 220"/>
            <path d="M428 220 L434 240"/>
            <path d="M360 294 L432 238"/>
            <path d="M434 240 L450 285"/>
            <path d="M330 236 L328 231"/>
          </g>
          <path d="M312 231 C318 225 336 225 342 230 L338 234 L316 234 Z" fill="#2f3a46"/>

          <!-- chain + chainring -->
          <path d="M360 280 L270 277 A8 8 0 0 0 270 293 L360 308 A14 14 0 0 0 360 280 Z"
                fill="none" stroke="#8895a3" stroke-width="3" stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" values="0;88" dur="1s" repeatCount="indefinite"/>
          </path>
          <circle cx="360" cy="294" r="14" fill="none" stroke="#8895a3" stroke-width="2.5"/>
          <circle cx="270" cy="285" r="8" fill="none" stroke="#8895a3" stroke-width="2.5"/>

          <!-- crank + pedals -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 360 294" to="360 360 294" dur="1s" repeatCount="indefinite"/>
            <line x1="360" y1="294" x2="338" y2="294" stroke="#5c6a76" stroke-width="4" stroke-linecap="round"/>
            <line x1="360" y1="294" x2="382" y2="294" stroke="#2f3a46" stroke-width="4" stroke-linecap="round"/>
            <g>
              <animateTransform attributeName="transform" type="rotate"
                from="0 382 294" to="-360 382 294" dur="1s" repeatCount="indefinite"/>
              <rect x="373" y="291" width="18" height="5" rx="2" fill="#2f3a46"/>
            </g>
          </g>

          <!-- pelican -->
          <g>
            <!-- tail -->
            <path d="M250 196 L206 172 L212 202 L252 210 Z" fill="#dfe7ee"/>

            <!-- body -->
            <ellipse cx="305" cy="185" rx="62" ry="45" fill="#f2f6f9" stroke="#cfd9e2" stroke-width="2"/>

            <!-- neck + head (gentle bob) -->
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="0 352 172; 2.5 352 172; 0 352 172; -2 352 172; 0 352 172"
                keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
              <path d="M350 170 C368 152 378 140 398 132" fill="none" stroke="#f2f6f9"
                    stroke-width="24" stroke-linecap="round"/>
              <circle cx="412" cy="124" r="21" fill="#f2f6f9" stroke="#cfd9e2" stroke-width="2"/>

              <!-- cycling cap -->
              <path d="M392 112 C394 99 412 95 425 105 L425 112 Z" fill="#e0554f"/>
              <path d="M425 108 L441 111 L425 114 Z" fill="#c8443e"/>

              <!-- bill + throat pouch (with a snack) -->
              <path d="M428 124 C444 148 474 150 504 128 L508 122 L428 122 Z" fill="#f4a259">
                <animate attributeName="d" dur="1s" repeatCount="indefinite"
                  values="M428 124 C444 148 474 150 504 128 L508 122 L428 122 Z;
                          M428 124 C449 154 481 156 504 128 L508 122 L428 122 Z;
                          M428 124 C444 148 474 150 504 128 L508 122 L428 122 Z"
                  keyTimes="0;0.5;1"/>
              </path>
              <path d="M428 114 L508 120 L508 124 L428 124 Z" fill="#e08a4c"/>
              <path d="M462 136 C470 132 480 134 486 138 C480 142 470 142 462 138 Z" fill="#b4593f"/>
              <circle cx="445" cy="118" r="1.6" fill="#b4593f"/>

              <!-- eye + blink -->
              <ellipse cx="406" cy="118" rx="6" ry="6" fill="#1f2a35">
                <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.55;0.58;0.61;1"
                         dur="3s" repeatCount="indefinite"/>
              </ellipse>
              <circle cx="408" cy="116" r="1.8" fill="#fff"/>
            </g>

            <!-- wing reaching the handlebar -->
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="0 318 178; -3.5 318 178; 0 318 178; 2.5 318 178; 0 318 178"
                keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
              <path d="M316 172 C342 166 366 178 384 192 C404 204 424 210 438 212
                       L436 220 C414 220 392 214 372 204 C350 194 328 188 314 184 Z"
                    fill="#dfe7ee" stroke="#c8d4de" stroke-width="2"/>
              <g stroke="#c8d4de" stroke-width="1.6" fill="none" stroke-linecap="round">
                <path d="M352 196 L362 202 M372 204 L382 209 M392 210 L402 214"/>
              </g>
            </g>

            <!-- near leg -->
            <g stroke="#7c8a97" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M345 220 L388.5 240.4 L382 294">
                <animate attributeName="d" dur="1s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                  values="M345 220 L388.5 240.4 L382 294;M345 220 L377.2 255.6 L375.6 309.6;M345 220 L367.3 262.5 L360 316;M345 220 L369.1 261.5 L344.4 309.6;M345 220 L376.5 256.2 L338 294;M345 220 L386.3 244.4 L344.4 278.4;M345 220 L392.2 228.7 L360 272;M345 220 L392.5 227.2 L375.6 278.4;M345 220 L388.5 240.4 L382 294"/>
              </path>
            </g>
            <g fill="#e08a4c">
              <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                values="382,294;375.6,309.6;360,316;344.4,309.6;338,294;344.4,278.4;360,272;375.6,278.4;382,294"/>
              <path d="M0 0 L14 3 L12 9 L-2 7 Z"/>
              <path d="M0 0 L12 5 M0 0 L10 8" stroke="#c9764f" stroke-width="1.4" fill="none"/>
            </g>
            <g fill="#8ea0ad">
              <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                values="388.5,240.4;377.2,255.6;367.3,262.5;369.1,261.5;376.5,256.2;386.3,244.4;392.2,228.7;392.5,227.2;388.5,240.4"/>
              <circle r="3.2"/>
            </g>
          </g>

          <!-- handlebar + bell -->
          <g>
            <path d="M428 220 L444 214" stroke="#2f3a46" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle cx="444" cy="214" r="4" fill="#2f3a46"/>
            <circle cx="452" cy="206" r="6" fill="#ffd86b"/>
            <circle cx="452" cy="206" r="6" fill="none" stroke="#e0b53f" stroke-width="1.5">
              <animate attributeName="r" values="6;7.5;6" dur="2s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>
      </g>
    </svg>

    <div class="controls">
      <button id="toggle" aria-pressed="false">Pause</button>
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2">2×</button>
    </div>
    <p class="hint">Animation is declarative SMIL inside the SVG — the buttons pause the timeline and rescale every animation's duration.</p>
  </main>

<script>
  const svg = document.getElementById('scene');
  const anims = [...svg.querySelectorAll('animate, animateTransform, animateMotion')].filter(a => a.getAttribute('dur'));
  anims.forEach(a => a.dataset.base = parseFloat(a.getAttribute('dur')));

  const toggle = document.getElementById('toggle');
  let paused = false;

  function setSpeed(s){
    anims.forEach(a => a.setAttribute('dur', (a.dataset.base / s) + 's'));
    svg.setCurrentTime(0);
  }

  document.querySelectorAll('[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      setSpeed(parseFloat(btn.dataset.speed));
    });
  });

  toggle.addEventListener('click', () => {
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    toggle.textContent = paused ? 'Play' : 'Pause';
    toggle.setAttribute('aria-pressed', String(paused));
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) toggle.click();
</script>
</body>
</html>
