<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican riding a bicycle — self-contained SVG animation</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2b; --line:#283244; --ink:#e9eef7; --muted:#9fb0c6; --accent:#f4a259;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 18px;
    background:radial-gradient(1100px 700px at 50% -10%, #1b2434, var(--bg));
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  }
  .card{
    width:min(940px,100%); background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  h1{margin:0 0 4px; font-size:1.25rem; letter-spacing:.02em}
  .sub{margin:0 0 16px; color:var(--muted); font-size:.9rem}
  svg{display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); background:#cfe9f6}
  .controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center}
  button{
    appearance:none; border:1px solid var(--line); background:#1d2634; color:var(--ink);
    padding:8px 14px; border-radius:10px; font:inherit; font-size:.85rem; cursor:pointer;
  }
  button:hover{background:#243040}
  button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#1a1206}
  .hint{margin-top:10px; color:var(--muted); font-size:.82rem}
</style>
</head>
<body>
  <main class="card">
    <h1>Pelican riding a bicycle</h1>
    <p class="sub">Self-contained 2D SVG animation — pure markup, no external assets.</p>

    <svg id="scene" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A pelican pedalling a bicycle along a road">
      <title>Pelican riding a bicycle</title>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8dff2"/>
          <stop offset="1" stop-color="#e9f6fb"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5b6a7c"/>
          <stop offset="1" stop-color="#394452"/>
        </linearGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fc9a8"/>
          <stop offset="1" stop-color="#74b091"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#63a979"/>
          <stop offset="1" stop-color="#549468"/>
        </linearGradient>

        <g id="cloud">
          <path d="M0 0 C4 -12 18 -18 30 -12 C36 -22 54 -22 60 -10 C72 -12 78 -4 78 0 Z"
                fill="#ffffff" opacity=".85"/>
        </g>
        <g id="tuft">
          <path d="M0 0 L-6 -12 M0 0 L0 -15 M0 0 L6 -12" stroke="#4f8a63" stroke-width="3"
                stroke-linecap="round" fill="none"/>
        </g>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="800" height="292" fill="url(#sky)"/>

      <!-- sun -->
      <g>
        <circle cx="110" cy="90" r="26" fill="#ffd27a"/>
        <g stroke="#ffd27a" stroke-width="4" stroke-linecap="round">
          <path d="M136 90 L144 90 M128.4 108.4 L134 114 M110 116 L110 124 M91.6 108.4 L86 114
                   M84 90 L76 90 M91.6 71.6 L86 66 M110 64 L110 56 M128.4 71.6 L134 66"/>
          <animateTransform attributeName="transform" type="rotate"
                            values="0 110 90;360 110 90" dur="40s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- hills (parallax, seamless loop) -->
      <g>
        <g>
          <path d="M0 292 L0 250 C70 232 140 244 210 250 C280 256 350 232 420 240
                   C490 248 560 236 630 244 C700 252 770 244 800 250 L800 292 Z" fill="url(#hillFar)"/>
          <path d="M800 292 L800 250 C870 232 940 244 1010 250 C1080 256 1150 232 1220 240
                   C1290 248 1360 236 1430 244 C1500 252 1570 244 1600 250 L1600 292 Z" fill="url(#hillFar)"/>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-800 0" dur="45s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M0 292 L0 268 C80 258 160 272 240 266 C320 260 400 274 480 268
                   C560 262 640 276 720 270 C770 266 790 268 800 268 L800 292 Z" fill="url(#hillNear)"/>
          <path d="M800 292 L800 268 C880 258 960 272 1040 266 C1120 260 1200 274 1280 268
                   C1360 262 1440 276 1520 270 C1570 266 1590 268 1600 268 L1600 292 Z" fill="url(#hillNear)"/>
          <g fill="#43795a">
            <circle cx="120" cy="262" r="10"/><circle cx="380" cy="266" r="12"/><circle cx="640" cy="262" r="10"/>
            <circle cx="920" cy="262" r="10"/><circle cx="1180" cy="266" r="12"/><circle cx="1440" cy="262" r="10"/>
          </g>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-800 0" dur="22s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- clouds -->
      <g>
        <g>
          <g transform="translate(120,110) scale(1.1)"><use href="#cloud"/></g>
          <g transform="translate(920,110) scale(1.1)"><use href="#cloud"/></g>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-800 0" dur="34s" repeatCount="indefinite"/>
        </g>
        <g>
          <g transform="translate(430,168) scale(.8)"><use href="#cloud"/></g>
          <g transform="translate(1230,168) scale(.8)"><use href="#cloud"/></g>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-800 0" dur="26s" repeatCount="indefinite"/>
        </g>
        <g>
          <g transform="translate(660,72) scale(.6)"><use href="#cloud"/></g>
          <g transform="translate(1460,72) scale(.6)"><use href="#cloud"/></g>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-800 0" dur="19s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- road -->
      <rect x="0" y="292" width="800" height="128" fill="url(#road)"/>
      <line x1="0" y1="292" x2="800" y2="292" stroke="#7c8b9d" stroke-width="3"/>
      <line x1="0" y1="352" x2="800" y2="352" stroke="#c8d4e0" stroke-width="6"
            stroke-dasharray="40 60" stroke-linecap="butt">
        <animate attributeName="stroke-dashoffset" values="0;100" dur="0.3534s" repeatCount="indefinite"/>
      </line>

      <!-- foreground grass -->
      <g>
        <g>
          <g transform="translate(40,404)"><use href="#tuft"/></g>
          <g transform="translate(323,404)"><use href="#tuft"/></g>
          <g transform="translate(606,404)"><use href="#tuft"/></g>
          <g transform="translate(889,404)"><use href="#tuft"/></g>
          <g transform="translate(1172,404)"><use href="#tuft"/></g>
          <animateTransform attributeName="transform" type="translate"
                            values="0 0;-283 0" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- speed streaks -->
      <g stroke="#9ec6dd" stroke-width="3" stroke-linecap="round" fill="none">
        <g>
          <path d="M150 150 L210 150"/>
          <animateTransform attributeName="transform" type="translate" values="60 0;-120 0"
                            dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.9;0" dur="0.8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M120 205 L186 205"/>
          <animateTransform attributeName="transform" type="translate" values="80 0;-140 0"
                            dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.8;0" dur="0.9s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M160 250 L214 250"/>
          <animateTransform attributeName="transform" type="translate" values="40 0;-130 0"
                            dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.7;0" dur="0.7s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- contact shadow -->
      <ellipse cx="360" cy="332" rx="145" ry="8" fill="#000" opacity=".18"/>

      <!-- ============ rider + bicycle ============ -->
      <g id="rider">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0;0 -2;0 0;0 -2;0 0" keyTimes="0;.25;.5;.75;1"
                          dur="1s" repeatCount="indefinite"/>

        <!-- far leg (behind the bike) -->
        <path fill="none" stroke="#b3a99d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
              d="M335 228 L371.1 256.5 L338 294">
          <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="M335 228 L371.1 256.5 L338 294;
                    M335 228 L378.8 242.1 L344.4 278.4;
                    M335 228 L381 226.6 L360 272;
                    M335 228 L381 228.7 L375.6 278.4;
                    M335 228 L378.1 244.2 L382 294;
                    M335 228 L367.9 260.1 L375.6 309.6;
                    M335 228 L360.9 266 L360 316;
                    M335 228 L364.1 263.6 L344.4 309.6;
                    M335 228 L371.1 256.5 L338 294"/>
        </path>
        <g fill="#c2b7a8">
          <path d="M0 -2 L14 0 L16 6 L8 8 L0 6 Z"/>
          <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" calcMode="linear"
            values="338 294;344.4 278.4;360 272;375.6 278.4;382 294;375.6 309.6;360 316;344.4 309.6;338 294"/>
        </g>

        <!-- wheels -->
        <g>
          <circle cx="270" cy="285" r="45" fill="none" stroke="#222c37" stroke-width="9"/>
          <circle cx="270" cy="285" r="40" fill="none" stroke="#8fa3b8" stroke-width="3"/>
          <path stroke="#a9bccd" stroke-width="2.2" fill="none"
                d="M270 285 L315 285 M270 285 L301.8 316.8 M270 285 L270 330 M270 285 L238.2 316.8
                   M270 285 L225 285 M270 285 L238.2 253.2 M270 285 L270 240 M270 285 L301.8 253.2">
            <animateTransform attributeName="transform" type="rotate" values="0 270 285;360 270 285"
                              dur="1s" repeatCount="indefinite"/>
          </path>
          <circle cx="270" cy="285" r="5" fill="#33404d"/>
        </g>
        <g>
          <circle cx="450" cy="285" r="45" fill="none" stroke="#222c37" stroke-width="9"/>
          <circle cx="450" cy="285" r="40" fill="none" stroke="#8fa3b8" stroke-width="3"/>
          <path stroke="#a9bccd" stroke-width="2.2" fill="none"
                d="M450 285 L495 285 M450 285 L481.8 316.8 M450 285 L450 330 M450 285 L418.2 316.8
                   M450 285 L405 285 M450 285 L418.2 253.2 M450 285 L450 240 M450 285 L481.8 253.2">
            <animateTransform attributeName="transform" type="rotate" values="0 450 285;360 450 285"
                              dur="1s" repeatCount="indefinite"/>
          </path>
          <circle cx="450" cy="285" r="5" fill="#33404d"/>
        </g>

        <!-- frame -->
        <g stroke="#e76f51" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M270 285 L360 294 L332 240 L270 285 Z"/>
          <path d="M332 240 L428 222 L450 285"/>
          <path d="M428 222 L442 224"/>
        </g>
        <circle cx="446" cy="225" r="4.5" fill="#2f3b47"/>
        <path d="M316 238 C320 233 344 233 348 239 L340 243 L320 243 Z" fill="#2f3b47"/>

        <!-- drivetrain -->
        <circle cx="360" cy="294" r="16" fill="none" stroke="#7f8f9f" stroke-width="3"/>
        <circle cx="270" cy="285" r="9" fill="none" stroke="#7f8f9f" stroke-width="3"/>
        <path d="M360 278 L270 276 M360 310 L270 294" fill="none" stroke="#596573"
              stroke-width="3" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
        </path>

        <!-- crank + pedals -->
        <g>
          <path d="M360 294 L382 294 M360 294 L338 294" stroke="#33404d" stroke-width="4"
                stroke-linecap="round" fill="none"/>
          <animateTransform attributeName="transform" type="rotate" values="0 360 294;360 360 294"
                            dur="1s" repeatCount="indefinite"/>
          <g>
            <rect x="374" y="291" width="16" height="5" rx="2" fill="#33404d"/>
            <animateTransform attributeName="transform" type="rotate" values="0 382 294;-360 382 294"
                              dur="1s" repeatCount="indefinite"/>
          </g>
          <g>
            <rect x="330" y="291" width="16" height="5" rx="2" fill="#28323d"/>
            <animateTransform attributeName="transform" type="rotate" values="0 338 294;-360 338 294"
                              dur="1s" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- near leg -->
        <path fill="none" stroke="#d9cfc2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
              d="M335 228 L378.1 244.2 L382 294">
          <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="M335 228 L378.1 244.2 L382 294;
                    M335 228 L367.9 260.1 L375.6 309.6;
                    M335 228 L360.9 266 L360 316;
                    M335 228 L364.1 263.6 L344.4 309.6;
                    M335 228 L371.1 256.5 L338 294;
                    M335 228 L378.8 242.1 L344.4 278.4;
                    M335 228 L381 226.6 L360 272;
                    M335 228 L381 228.7 L375.6 278.4;
                    M335 228 L378.1 244.2 L382 294"/>
        </path>

        <!-- body -->
        <g>
          <path d="M236 196 C240 166 262 146 296 144 C330 142 356 158 362 180
                   C368 202 360 224 340 232 C318 240 262 236 244 220 C238 212 236 204 236 196 Z"
                fill="#eef3f7" stroke="#b9c6d2" stroke-width="2"/>
          <path d="M240 198 L196 188 L200 202 L194 214 L242 220 Z" fill="#dfe7ee" stroke="#b9c6d2" stroke-width="2"/>
          <path d="M250 214 C272 222 300 222 322 214" fill="none" stroke="#c6d2dc" stroke-width="2"/>
        </g>

        <!-- wing reaching the handlebar -->
        <g>
          <path d="M318 162 C338 164 362 180 386 196 C404 208 424 216 436 220
                   L438 226 C424 224 404 214 386 202 C364 188 340 176 320 172 Z"
                fill="#dfe7ee" stroke="#b9c6d2" stroke-width="2"/>
          <path d="M330 172 C352 182 372 194 392 206 M340 178 C360 188 380 200 398 212"
                fill="none" stroke="#c6d2dc" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate"
                            values="0 322 170;-4 322 170;0 322 170;3 322 170;0 322 170"
                            keyTimes="0;.25;.5;.75;1" dur="1s" repeatCount="indefinite"/>
        </g>

        <!-- neck, head, bill -->
        <g>
          <path d="M352 180 C368 156 384 138 404 126" fill="none" stroke="#eef3f7"
                stroke-width="20" stroke-linecap="round"/>
          <g>
            <circle cx="412" cy="118" r="19" fill="#eef3f7" stroke="#b9c6d2" stroke-width="2"/>
            <path d="M424 110 L506 122 C508 124 508 126 506 127 L426 126 Z" fill="#f4a259"/>
            <path d="M424 124 C432 142 458 148 490 138 C498 134 504 128 506 124 Z" fill="#e8875c">
              <animate attributeName="d" dur="2.4s" repeatCount="indefinite" calcMode="spline"
                keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"
                values="M424 124 C432 142 458 148 490 138 C498 134 504 128 506 124 Z;
                        M424 124 C434 152 462 158 492 142 C500 138 505 130 506 124 Z;
                        M424 124 C432 142 458 148 490 138 C498 134 504 128 506 124 Z"/>
            </path>
            <path d="M440 116 L448 116" stroke="#c9764a" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="418" cy="112" rx="4.5" ry="4.5" fill="#1f2a35">
              <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5"
                       keyTimes="0;.86;.89;.92;1" dur="3.2s" repeatCount="indefinite"/>
            </ellipse>
            <path d="M394 104 C396 90 424 88 430 102 Z" fill="#e76f51"/>
            <path d="M428 100 C440 100 450 103 452 106 L430 105 Z" fill="#c9553c"/>
            <animateTransform attributeName="transform" type="rotate"
                              values="0 404 126;2.5 404 126;0 404 126;-2 404 126;0 404 126"
                              keyTimes="0;.25;.5;.75;1" dur="1s" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- near foot on the pedal -->
        <g fill="#d9cfc2" stroke="#a89e91" stroke-width="1.5">
          <path d="M0 -2 L14 0 L16 6 L8 8 L0 6 Z"/>
          <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" calcMode="linear"
            values="382 294;375.6 309.6;360 316;344.4 309.6;338 294;344.4 278.4;360 272;375.6 278.4;382 294"/>
        </g>
      </g>
    </svg>

    <div class="controls">
      <button id="toggle" aria-pressed="false">Pause</button>
      <button class="speed" data-speed="0.5">0.5×</button>
      <button class="speed" data-speed="1" aria-pressed="true">1×</button>
      <button class="speed" data-speed="2">2×</button>
    </div>
    <p class="hint">Everything is drawn with SVG shapes and animated with SMIL — no images, no libraries.</p>
  </main>

  <script>
    const svg = document.getElementById('scene');
    const anims = Array.from(svg.querySelectorAll('animate, animateTransform, animateMotion'));
    const baseDur = anims.map(a => parseFloat(a.getAttribute('dur')));
    let speed = 1, paused = false;

    const toggle = document.getElementById('toggle');

    function applySpeed(s) {
      speed = s;
      anims.forEach((a, i) => a.setAttribute('dur', (baseDur[i] / s) + 's'));
      svg.setCurrentTime(0);
      if (paused) svg.pauseAnimations();
    }

    toggle.addEventListener('click', () => {
      paused = !paused;
      if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
      toggle.textContent = paused ? 'Play' : 'Pause';
      toggle.setAttribute('aria-pressed', String(paused));
    });

    document.querySelectorAll('.speed').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed').forEach(b => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        applySpeed(parseFloat(btn.dataset.speed));
      });
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paused = true;
      svg.pauseAnimations();
      toggle.textContent = 'Play';
      toggle.setAttribute('aria-pressed', 'true');
    }
  </script>
</body>
</html>
