<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:24px;background:radial-gradient(1100px 620px at 50% -12%,#203a5c,#0f172a 70%);
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e2e8f0}
.card{width:min(940px,100%);background:#fff;color:#1f2937;border-radius:18px;
 padding:22px 24px 16px;box-shadow:0 26px 60px rgba(0,0,0,.38)}
h1{margin:0 0 6px;font-size:1.35rem;letter-spacing:.2px}
.sub{margin:0 0 14px;color:#64748b;font-size:.92rem}
svg{display:block;width:100%;height:auto;border-radius:12px;background:#eaf6fb}
.foot{margin-top:12px;font-size:.8rem;color:#94a3b8}
</style>
</head>
<body>
<main class="card">
  <h1>Pelican on a Bicycle</h1>
  <p class="sub">A self-contained SVG animation &mdash; crank, chain, wheels and pedalling legs are all in sync.</p>

  <svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="A pelican riding a bicycle: wheels spin, pedals turn, wings flap, scenery drifts past.">
    <title>Pelican on a bicycle</title>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe2f5"/>
        <stop offset="1" stop-color="#eef7fb"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5b6672"/>
        <stop offset="1" stop-color="#414b57"/>
      </linearGradient>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="800" height="330" fill="url(#sky)"/>

    <!-- sun -->
    <g transform="translate(672,92)">
      <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                          dur="40s" repeatCount="indefinite"/>
        <line x1="0" y1="-46" x2="0" y2="-58"/><line x1="0" y1="46" x2="0" y2="58"/>
        <line x1="-46" y1="0" x2="-58" y2="0"/><line x1="46" y1="0" x2="58" y2="0"/>
        <line x1="33" y1="-33" x2="41" y2="-41"/><line x1="-33" y1="33" x2="-41" y2="41"/>
        <line x1="33" y1="33" x2="41" y2="41"/><line x1="-33" y1="-33" x2="-41" y2="-41"/>
      </g>
      <circle r="34" fill="#ffd166"/>
    </g>

    <!-- clouds (seamless loop) -->
    <g fill="#ffffff" opacity=".82">
      <animateTransform attributeName="transform" type="translate" values="0 0;-800 0"
                        dur="34s" repeatCount="indefinite"/>
      <g>
        <path d="M60 120 q18 -26 44 -14 q14 -22 40 -10 q22 4 20 24 z"/>
        <path d="M460 70 q16 -22 40 -12 q14 -18 36 -8 q20 4 18 20 z"/>
        <path d="M700 150 q14 -20 36 -10 q12 -16 32 -6 q18 4 16 16 z"/>
        <path d="M860 120 q18 -26 44 -14 q14 -22 40 -10 q22 4 20 24 z"/>
        <path d="M1260 70 q16 -22 40 -12 q14 -18 36 -8 q20 4 18 20 z"/>
        <path d="M1500 150 q14 -20 36 -10 q12 -16 32 -6 q18 4 16 16 z"/>
      </g>
    </g>

    <!-- hills -->
    <path d="M0 300 L120 240 L210 285 L320 232 L430 288 L540 244 L660 292 L800 250 L800 330 L0 330 Z"
          fill="#a7d3b4"/>
    <path d="M0 318 L140 292 L260 312 L400 290 L520 314 L660 296 L800 316 L800 330 L0 330 Z"
          fill="#8cc4a1"/>

    <!-- passing bushes (seamless loop) -->
    <g fill="#6faa86">
      <animateTransform attributeName="transform" type="translate" values="0 0;-200 0"
                        dur="4.5s" repeatCount="indefinite"/>
      <g><ellipse cx="30" cy="338" rx="22" ry="12"/><ellipse cx="230" cy="336" rx="16" ry="10"/>
         <ellipse cx="430" cy="340" rx="24" ry="12"/><ellipse cx="630" cy="336" rx="18" ry="10"/>
         <ellipse cx="830" cy="338" rx="22" ry="12"/><ellipse cx="1030" cy="336" rx="16" ry="10"/></g>
    </g>

    <!-- road -->
    <rect x="0" y="330" width="800" height="100" fill="url(#road)"/>
    <path d="M0 382 H800" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="46 54">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- ground shadow -->
    <ellipse cx="360" cy="354" rx="150" ry="9" fill="#0f172a" opacity=".16"/>

    <!-- wheels -->
    <g stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 250 300" to="360 250 300"
                          dur="0.9s" repeatCount="indefinite"/>
        <circle cx="250" cy="300" r="46" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <g stroke="#94a3b8" stroke-width="2.2"><line x1="250.0" y1="300.0" x2="296.0" y2="300.0"/><line x1="250.0" y1="300.0" x2="282.5" y2="332.5"/><line x1="250.0" y1="300.0" x2="250.0" y2="346.0"/><line x1="250.0" y1="300.0" x2="217.5" y2="332.5"/><line x1="250.0" y1="300.0" x2="204.0" y2="300.0"/><line x1="250.0" y1="300.0" x2="217.5" y2="267.5"/><line x1="250.0" y1="300.0" x2="250.0" y2="254.0"/><line x1="250.0" y1="300.0" x2="282.5" y2="267.5"/></g>
      </g>
      <circle cx="250" cy="300" r="52" fill="none" stroke="#1f2937" stroke-width="9"/>
      <circle cx="250" cy="300" r="6" fill="#334155"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 470 300" to="360 470 300"
                          dur="0.9s" repeatCount="indefinite"/>
        <circle cx="470" cy="300" r="46" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <g stroke="#94a3b8" stroke-width="2.2"><line x1="470.0" y1="300.0" x2="516.0" y2="300.0"/><line x1="470.0" y1="300.0" x2="502.5" y2="332.5"/><line x1="470.0" y1="300.0" x2="470.0" y2="346.0"/><line x1="470.0" y1="300.0" x2="437.5" y2="332.5"/><line x1="470.0" y1="300.0" x2="424.0" y2="300.0"/><line x1="470.0" y1="300.0" x2="437.5" y2="267.5"/><line x1="470.0" y1="300.0" x2="470.0" y2="254.0"/><line x1="470.0" y1="300.0" x2="502.5" y2="267.5"/></g>
      </g>
      <circle cx="470" cy="300" r="52" fill="none" stroke="#1f2937" stroke-width="9"/>
      <circle cx="470" cy="300" r="6" fill="#334155"/>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 212 L350 305"/>
      <path d="M296 214 L250 300"/>
      <path d="M250 300 L350 305"/>
      <path d="M350 305 L452 222"/>
      <path d="M452 222 L458 242"/>
      <path d="M452 222 L470 300"/>
      <path d="M452 222 L450 212 L472 208"/>
    </g>
    <path d="M278 211 C292 207 312 209 316 213 L280 217 Z" fill="#1f2937"/>

    <!-- chain -->
    <path d="M250 288 L350 283 A22 22 0 0 1 350 327 L250 312 A12 12 0 0 1 250 288 Z"
          fill="none" stroke="#475569" stroke-width="5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 305" to="360 350 305"
                        dur="1.2s" repeatCount="indefinite"/>
      <circle cx="350" cy="305" r="22" fill="none" stroke="#64748b" stroke-width="4"
            stroke-dasharray="6 4"/>
      <g stroke="#64748b" stroke-width="2.5"><line x1="350" y1="305" x2="372.0" y2="305.0"/><line x1="350" y1="305" x2="356.8" y2="325.9"/><line x1="350" y1="305" x2="332.2" y2="317.9"/><line x1="350" y1="305" x2="332.2" y2="292.1"/><line x1="350" y1="305" x2="356.8" y2="284.1"/></g>
      <circle cx="350" cy="305" r="4" fill="#64748b"/>
    </g>
    <circle cx="250" cy="300" r="12" fill="none" stroke="#64748b" stroke-width="4"/>

    <!-- far crank + far leg -->
    <g stroke="#c2410c" stroke-width="6" stroke-linecap="round" fill="none">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180 350 305" to="540 350 305"
                          dur="1.2s" repeatCount="indefinite"/>
        <line x1="350" y1="305" x2="382" y2="305"/>
      </g>
      <path stroke-width="9" d="M 306.0 204.0 L 362.6 248.5 L 318.0 305.0 L 329.0 309.0">
        <animate attributeName="d" values="M 306.0 204.0 L 362.6 248.5 L 318.0 305.0 L 329.0 309.0;M 306.0 204.0 L 374.0 227.5 L 327.4 282.4 L 338.4 286.4;M 306.0 204.0 L 378.0 206.6 L 350.0 273.0 L 361.0 277.0;M 306.0 204.0 L 377.7 210.6 L 372.6 282.4 L 383.6 286.4;M 306.0 204.0 L 371.6 233.8 L 382.0 305.0 L 393.0 309.0;M 306.0 204.0 L 353.3 258.3 L 372.6 327.6 L 383.6 331.6;M 306.0 204.0 L 343.8 265.3 L 350.0 337.0 L 361.0 341.0;M 306.0 204.0 L 351.5 259.8 L 327.4 327.6 L 338.4 331.6;M 306.0 204.0 L 362.6 248.5 L 318.0 305.0 L 329.0 309.0" keyTimes="0;0.125;0.250;0.375;0.500;0.625;0.750;0.875;1.000"
                 calcMode="linear" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- pelican -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0"
                        dur="1.2s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M252 196 L206 210 L232 184 Z" fill="#dbe4ec"/>
      <!-- body -->
      <g transform="rotate(-8 300 180)">
        <ellipse cx="300" cy="180" rx="58" ry="42" fill="#f1f5f9"/>
        <path d="M258 196 C276 214 316 218 344 206" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      </g>
      <!-- far wing, flapping -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 292 168; -16 292 168; 0 292 168; 10 292 168; 0 292 168"
                          keyTimes="0;0.3;0.55;0.8;1" dur="1.2s" repeatCount="indefinite"/>
        <path d="M292 168 C252 152 232 132 236 112 C262 130 288 150 302 174 Z" fill="#d7e2ea"/>
      </g>
      <!-- neck -->
      <path d="M336 168 C352 150 372 132 396 124" fill="none" stroke="#f1f5f9"
            stroke-width="22" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="402" cy="118" r="16" fill="#f1f5f9"/>
      <!-- pouch (gulps) -->
      <path fill="#fbbf24" d="M416 122 C424 148 448 162 470 148 C462 138 440 130 416 122 Z">
        <animate attributeName="d"
                 values="M416 122 C424 148 448 162 470 148 C462 138 440 130 416 122 Z;M416 122 C428 158 452 172 472 152 C464 142 442 130 416 122 Z;M416 122 C424 148 448 162 470 148 C462 138 440 130 416 122 Z" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <!-- upper mandible -->
      <path d="M414 116 L474 132 L470 138 L416 124 Z" fill="#f59e0b"/>
      <circle cx="404" cy="114" r="3.4" fill="#1f2937"/>
      <!-- cycling cap -->
      <path d="M386 106 C392 96 412 96 418 106 Z" fill="#ef4444"/>
      <path d="M418 106 L440 110 L418 110 Z" fill="#dc2626"/>
      <!-- near wing resting on the handlebar -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 322 168;3 322 168;0 322 168" dur="1.2s" repeatCount="indefinite"/>
        <path d="M322 168 C360 176 410 196 448 214" fill="none" stroke="#e2e8f0"
              stroke-width="17" stroke-linecap="round"/>
        <path d="M436 208 L452 216 L434 218 Z" fill="#cbd5e1"/>
      </g>
    </g>

    <!-- near crank, pedal and pedalling leg -->
    <g stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 350 305" to="360 350 305"
                          dur="1.2s" repeatCount="indefinite"/>
        <line x1="350" y1="305" x2="382" y2="305"/>
      </g>
    </g>
    <g>
      <animateMotion path="M382 305 A32 32 0 1 1 318 305 A32 32 0 1 1 382 305"
                     dur="1.2s" repeatCount="indefinite"/>
      <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#334155"/>
    </g>
    <path stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
          fill="none" d="M 318.0 208.0 L 385.5 233.1 L 382.0 305.0 L 393.0 309.0">
      <animate attributeName="d" values="M 318.0 208.0 L 385.5 233.1 L 382.0 305.0 L 393.0 309.0;M 318.0 208.0 L 372.0 255.6 L 372.6 327.6 L 383.6 331.6;M 318.0 208.0 L 360.9 265.8 L 350.0 337.0 L 361.0 341.0;M 318.0 208.0 L 362.4 264.7 L 327.4 327.6 L 338.4 331.6;M 318.0 208.0 L 371.2 256.5 L 318.0 305.0 L 329.0 309.0;M 318.0 208.0 L 383.7 237.5 L 327.4 282.4 L 338.4 286.4;M 318.0 208.0 L 389.8 213.0 L 350.0 273.0 L 361.0 277.0;M 318.0 208.0 L 389.9 212.5 L 372.6 282.4 L 383.6 286.4;M 318.0 208.0 L 385.5 233.1 L 382.0 305.0 L 393.0 309.0" keyTimes="0;0.125;0.250;0.375;0.500;0.625;0.750;0.875;1.000"
               calcMode="linear" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- speed lines -->
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="150" y1="150" x2="196" y2="150">
        <animate attributeName="opacity" values="0;.8;0" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="120" y1="196" x2="172" y2="196">
        <animate attributeName="opacity" values=".8;0;.8" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="160" y1="240" x2="200" y2="240">
        <animate attributeName="opacity" values="0;.7;0" dur="1.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>

  <p class="foot">Pure SVG + SMIL &mdash; no scripts, no external assets.</p>
</main>
</body>
</html>
